name: release-windows
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  # Windows image build runs on a GitHub-hosted windows-latest runner which
  # ships with Docker Engine in Windows Container (WCOW) mode — required to
  # build images derived from the Windows HostProcess base image. The Linux
  # multi-arch manifest is produced by release.yaml; a follow-up
  # windows-manifest job here assembles the combined manifest list.
  windows-image:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare version
        id: prep
        shell: bash
        run: |
          VERSION=sha-${GITHUB_SHA::8}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF/refs\/tags\//}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Test Windows support
        run: go test ./...
      - name: Build spegel.exe
        run: |
          New-Item -ItemType Directory -Force -Path dist/spegel_windows_amd64 | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -o dist/spegel_windows_amd64/spegel.exe .
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: appmana
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Windows image
        shell: bash
        run: |
          IMG=ghcr.io/appmana/spegel:${{ steps.prep.outputs.VERSION }}-windows-amd64
          docker build -t "$IMG" -f Dockerfile.windows .
          docker push "$IMG"

  # Assemble a manifest list that resolves to either Linux or Windows
  # depending on the pulling node's OS. Runs after both legs have pushed
  # per-platform tags; can be re-run via workflow_dispatch.
  manifest-list:
    needs: [windows-image]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare version
        id: prep
        run: |
          VERSION=sha-${GITHUB_SHA::8}
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF/refs\/tags\//}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          registry: ghcr.io
          username: appmana
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        run: |
          IMG=ghcr.io/appmana/spegel
          V=${{ steps.prep.outputs.VERSION }}
          # The Linux multi-arch manifest at $IMG:$V is produced by the
          # release.yaml workflow; combine it with the Windows image.
          docker buildx imagetools create -t "$IMG:$V-multi" \
            "$IMG:$V" \
            "$IMG:$V-windows-amd64"
